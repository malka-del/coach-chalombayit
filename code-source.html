<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Le Code Source du Couple - LeLAB</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .text-gold { color: #d4af37; }
    .bg-dark { background-color: #0f172a; }
  </style>
</head>
<body class="bg-dark text-white min-h-screen flex items-center justify-center p-4">

  <div class="max-w-xl w-full bg-slate-900 rounded-2xl p-6 shadow-2xl border border-slate-800">
    
    <!-- HEADER -->
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-gold tracking-wide">LE CODE SOURCE DU COUPLE</h1>
      <p class="text-xs text-slate-400">by Chalom Bayit <span class="text-blue-400 font-semibold">LeLAB</span></p>
    </div>

    <!-- ECRAN 1 : LOGIN / CODE ACCES -->
    <div id="screen-login" class="space-y-4">
      <div>
        <label class="block text-sm text-slate-300 mb-1">Code d'accès du couple (MDP_Jeu) :</label>
        <input type="text" id="access-code" placeholder="Ex: CHALOM2026" class="w-full p-3 rounded-lg bg-slate-800 border border-slate-700 text-white uppercase tracking-wider focus:outline-none focus:border-gold">
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm text-slate-300 mb-1">Prénom Partenaire 1 :</label>
          <input type="text" id="input-p1" placeholder="Ex: Alison" class="w-full p-3 rounded-lg bg-slate-800 border border-slate-700 text-white focus:outline-none focus:border-gold">
        </div>
        <div>
          <label class="block text-sm text-slate-300 mb-1">Prénom Partenaire 2 :</label>
          <input type="text" id="input-p2" placeholder="Ex: David" class="w-full p-3 rounded-lg bg-slate-800 border border-slate-700 text-white focus:outline-none focus:border-gold">
        </div>
      </div>
      <button onclick="startGame()" class="w-full py-3 bg-gold text-slate-950 font-bold rounded-lg hover:bg-yellow-500 transition">Commencer la partie</button>
    </div>

    <!-- ECRAN 2 : JEU / CARTE EN COURS -->
    <div id="screen-game" class="hidden space-y-6">
      
      <!-- INTITULE QUESTION -->
      <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 text-center">
        <span id="question-number" class="text-xs font-semibold text-gold uppercase tracking-wider block mb-1">Question 1</span>
        <h3 id="question-text" class="text-lg font-medium text-slate-100">Intitulé de la question ici...</h3>
      </div>

      <!-- FORMULAIRE DE SAISIE PAR TOUR -->
      <div class="space-y-6 bg-slate-950/50 p-4 rounded-xl border border-slate-800">
        
        <!-- TOUR DE A -->
        <div class="space-y-3">
          <h4 class="text-gold font-bold text-sm uppercase tracking-wide border-b border-slate-800 pb-1">
            Tour de <span class="label-p1-name">A</span> :
          </h4>
          
          <div>
            <label class="block text-xs text-slate-400 mb-1">Réponse proposée par <span class="label-p1-name">A</span> :</label>
            <textarea id="input-prop-a" rows="2" class="w-full bg-slate-800 text-white p-3 rounded-lg border border-slate-700 text-sm focus:outline-none focus:border-gold" placeholder="Entrez la réponse..."></textarea>
          </div>

          <div>
            <label class="block text-xs text-slate-400 mb-1">Vraie réponse / Précision de <span class="label-p2-name">B</span> :</label>
            <textarea id="input-corr-b" rows="2" class="w-full bg-slate-800 text-white p-3 rounded-lg border border-slate-700 text-sm focus:outline-none focus:border-gold" placeholder="Entrez la vraie réponse / précision..."></textarea>
          </div>
        </div>

        <!-- TOUR DE B -->
        <div class="space-y-3 pt-2">
          <h4 class="text-gold font-bold text-sm uppercase tracking-wide border-b border-slate-800 pb-1">
            Tour de <span class="label-p2-name">B</span> :
          </h4>

          <div>
            <label class="block text-xs text-slate-400 mb-1">Réponse proposée par <span class="label-p2-name">B</span> :</label>
            <textarea id="input-prop-b" rows="2" class="w-full bg-slate-800 text-white p-3 rounded-lg border border-slate-700 text-sm focus:outline-none focus:border-gold" placeholder="Entrez la réponse..."></textarea>
          </div>

          <div>
            <label class="block text-xs text-slate-400 mb-1">Vraie réponse / Précision de <span class="label-p1-name">A</span> :</label>
            <textarea id="input-corr-a" rows="2" class="w-full bg-slate-800 text-white p-3 rounded-lg border border-slate-700 text-sm focus:outline-none focus:border-gold" placeholder="Entrez la vraie réponse / précision..."></textarea>
          </div>
        </div>

      </div>

      <!-- BOUTONS ACTION CARTE -->
      <div class="flex gap-3">
        <button onclick="submitCard()" class="flex-1 py-3 bg-emerald-600 hover:bg-emerald-500 font-bold text-white rounded-lg transition">
          Valider cette question
        </button>
        <button onclick="finishGame()" class="py-3 px-4 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-sm transition">
          Terminer la partie
        </button>
      </div>

    </div>

    <!-- ECRAN 3 : FIN DE PARTIE -->
    <div id="screen-end" class="hidden text-center space-y-6">
      <div class="space-y-2">
        <h2 class="text-2xl font-bold text-gold">Partie Terminée ! 👏</h2>
        <p id="end-summary-text" class="text-slate-300 text-sm">Vous avez répondu à toutes les questions.</p>
      </div>

      <div id="sync-status" class="text-xs text-slate-400 bg-slate-800/60 p-3 rounded-lg border border-slate-700">
        Synchronisation avec Airtable en cours...
      </div>

      <div class="space-y-3 pt-2">
        <a href="https://wa.me/" target="_blank" class="block w-full py-3 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold rounded-lg transition">
          💬 Poursuivre la Séance 2 sur WhatsApp
        </a>
        <button onclick="location.reload()" class="w-full py-3 bg-pink-600 hover:bg-pink-500 text-white font-semibold rounded-lg transition">
          🔄 Continuer le jeu (Nouvelle partie)
        </button>
      </div>
    </div>

  </div>

  <script>
    // Config API
    const VERCEL_API_URL = "https://coach-chalombayit.vercel.app/api/sync-airtable";
    
    // Etat de la partie
    let accessCodeUsed = "";
    let p1 = { name: "A", score: 0 };
    let p2 = { name: "B", score: 0 };
    
    let currentQuestionIndex = 0;
    let sessionDataLog = [];
    let isDataSynced = false;

    // Deck de questions exemples
    const gameDeck = [
      { id: 1, text: "Quel est ton plus beau souvenir partagé ensemble cette année ?" },
      { id: 2, text: "Quelle est la qualité que tu admires le plus chez ton partenaire ?" },
      { id: 3, text: "Quelle est la chose qui te permet de te sentir le plus en sécurité dans le couple ?" }
    ];

    function startGame() {
      accessCodeUsed = document.getElementById('access-code').value.trim().toUpperCase();
      p1.name = document.getElementById('input-p1').value.trim() || "Partenaire 1";
      p2.name = document.getElementById('input-p2').value.trim() || "Partenaire 2";

      if(!accessCodeUsed) {
        alert("Veuillez saisir votre code d'accès (MDP_Jeu).");
        return;
      }

      // Mise à jour dynamique des prénoms dans les labels
      document.querySelectorAll('.label-p1-name').forEach(el => el.textContent = p1.name);
      document.querySelectorAll('.label-p2-name').forEach(el => el.textContent = p2.name);

      document.getElementById('screen-login').classList.add('hidden');
      document.getElementById('screen-game').classList.remove('hidden');

      loadQuestion();
    }

    function loadQuestion() {
      if(currentQuestionIndex >= gameDeck.length) {
        finishGame();
        return;
      }

      const q = gameDeck[currentQuestionIndex];
      document.getElementById('question-number').textContent = `Question ${currentQuestionIndex + 1} / ${gameDeck.length}`;
      document.getElementById('question-text').textContent = q.text;

      // Réinitialiser les inputs
      document.getElementById('input-prop-a').value = '';
      document.getElementById('input-corr-b').value = '';
      document.getElementById('input-prop-b').value = '';
      document.getElementById('input-corr-a').value = '';
    }

    function submitCard() {
      const qText = gameDeck[currentQuestionIndex].text;

      const propA = document.getElementById('input-prop-a').value.trim();
      const corrB = document.getElementById('input-corr-b').value.trim();
      const propB = document.getElementById('input-prop-b').value.trim();
      const corrA = document.getElementById('input-corr-a').value.trim();

      // Enregistrement structuré du log
      sessionDataLog.push({
        question: qText,
        tour_A: {
          proposition_A: propA,
          correction_B: corrB
        },
        tour_B: {
          proposition_B: propB,
          correction_A: corrA
        }
      });

      currentQuestionIndex++;
      loadQuestion();
    }

    async function finishGame() {
      document.getElementById('screen-game').classList.add('hidden');
      document.getElementById('screen-end').classList.remove('hidden');

      document.getElementById('end-summary-text').textContent = 
        `Vous avez exploré ${sessionDataLog.length} question(s) lors de cette partie.`;

      await syncAirtable('completed');
    }

    async function syncAirtable(status = 'completed') {
      if (isDataSynced || sessionDataLog.length === 0) return;

      const currentCode = accessCodeUsed || document.getElementById('access-code')?.value?.trim()?.toUpperCase() || "";

      // Formatage textuel explicite pour le champ Airtable "Détail des réponses"
      const historiqueFormate = sessionDataLog.map((item, index) => {
        return `📌 QUESTION ${index + 1} : ${item.question}

--- TOUR DE ${p1.name.toUpperCase()} ---
• Réponse proposée par ${p1.name} :
  "${item.tour_A.proposition_A || 'Non renseigné'}"
• Vraie réponse / Précision de ${p2.name} :
  "${item.tour_A.correction_B || 'Non renseigné'}"

--- TOUR DE ${p2.name.toUpperCase()} ---
• Réponse proposée par ${p2.name} :
  "${item.tour_B.proposition_B || 'Non renseigné'}"
• Vraie réponse / Précision de ${p1.name} :
  "${item.tour_B.correction_A || 'Non renseigné'}"`;
      }).join('\n\n========================================\n\n');

      const payload = {
        MDP_Jeu: currentCode,
        prenom_p1: p1.name,
        prenom_p2: p2.name,
        score_p1: p1.score,
        score_p2: p2.score,
        total_questions: gameDeck.length,
        questions_responded: sessionDataLog.length,
        status: status,
        details_reponses: historiqueFormate,
        date: new Date().toISOString()
      };

      const syncStatusEl = document.getElementById('sync-status');

      try {
        const response = await fetch(VERCEL_API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (response.ok) {
          isDataSynced = true;
          syncStatusEl.textContent = "✅ Historique et résultats enregistrés avec succès dans Airtable !";
          syncStatusEl.className = "text-xs text-emerald-400 bg-emerald-950/40 p-3 rounded-lg border border-emerald-800";
        } else {
          throw new Error('Erreur API Vercel/Airtable');
        }
      } catch (e) {
        console.error("Erreur de synchronisation :", e);
        syncStatusEl.textContent = "❌ Échec de l'enregistrement automatique.";
        syncStatusEl.className = "text-xs text-red-400 bg-red-950/40 p-3 rounded-lg border border-red-800";
      }
    }
  </script>
</body>
</html>
